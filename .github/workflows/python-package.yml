name: Python package
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -c requirements.lock -e '.[test,native]'
      - run: ruff check src tests scripts
      - run: python -m pytest -q
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
      - run: node --test tests/client.test.mjs
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Check wheel includes identical static client
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile(next(Path('dist').glob('*.whl'))) as wheel:
              for source in Path('src/multibox/static').iterdir():
                  assert wheel.read(f'multibox/static/{source.name}') == source.read_bytes()
          PY
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -c requirements.lock -e '.[test]'
      - run: npm ci --prefix tests/browser
      - run: scripts/browser_check.sh /tmp/multibox-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-qa
          path: /tmp/multibox-browser
          retention-days: 7
